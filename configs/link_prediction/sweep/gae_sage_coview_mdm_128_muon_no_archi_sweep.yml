command:
  - python
  - /Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/scripts/wandb_sweep_agent.py

name: gae_sage_coview_mdm_128_muon_no_archi_sweep

method: bayes

metric:
  goal: maximize
  name: test/mrr_trigger

run_cap: 40

parameters:
  base_config_file:
    values:
      - /Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_sage_coview_mdm_128_muon.yml

  trainer_config:
    parameters:
      max_time:
        value: "00:00:40:00"
      max_epochs:
        value: 500
      limit_test_batches:
        value: 1.0

  model_parameters:
    parameters:
      architecture_parameters:
        parameters:
          dropout:
            values: [0.0, 0.1, 0.2, 0.3]

      optimizer:
        parameters:
          parameters:
            parameters:
              lr:
                distribution: "log_uniform_values"
                min: 0.0005
                max: 0.01
              weight_decay:
                distribution: "log_uniform_values"
                min: 0.000001
                max: 0.01
              adamw_lr:
                distribution: "log_uniform_values"
                min: 0.0001
                max: 0.005
              momentum:
                values: [0.9, 0.95, 0.98]
