      name: coview-mdm-training
      tasks:
        - task_key: train
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm.yml"
