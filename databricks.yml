bundle:
  name: fast-gnn-benchmark

workspace:
  host: https://mirakl-ai.cloud.databricks.com
  profile: mirakl-ai

resources:
  jobs:
    coview_mdm_training:
      name: coview-mdm-training
      tasks:
        - task_key: train
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    coview_mdm_training_128:
      name: coview-mdm-training-128
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_128.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_128: seul le bloc optimizer differe
    # (muon au lieu d'adamw) et le dirpath des checkpoints (coview-mdm-128-muon).
    coview_mdm_training_128_muon:
      name: coview-mdm-training-128-muon
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_128_muon.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_128_muon: seule la tete change
    # (cosine nu au lieu de hadamard_mlp) et le dirpath des checkpoints.
    coview_mdm_training_128_muon_cosine:
      name: coview-mdm-training-128-muon-cosine
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_128_muon_cosine.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_128_muon: seule la tete change
    # (tour MLP partagee puis cosine au lieu de hadamard_mlp) et le dirpath des checkpoints.
    coview_mdm_training_128_muon_mlp_cosine:
      name: coview-mdm-training-128-muon-mlp-cosine
      tasks:
        - task_key: train
          existing_cluster_id: 0703-144521-5dhs4etp
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_128_muon_mlp_cosine.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_128: le config prototype n'en differe que
    # par dataset_type (data_prototype.pt) et dirpath (checkpoints coview-mdm-prototype).
    coview_mdm_training_prototype:
      name: coview-mdm-training-prototype
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_prototype.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    coview_mdm_training_cosine:
      name: coview-mdm-training-cosine
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_cosine.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_cosine: seule la tete change
    # (tour MLP partagee puis cosine au lieu du cosine nu) et le dirpath des checkpoints.
    coview_mdm_training_mlp_cosine:
      name: coview-mdm-training-mlp-cosine
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_gcn_coview_mdm_mlp_cosine.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_128: seuls le backbone
    # (sage au lieu de gcn, sans conv_parameters.cached) et le dirpath des checkpoints changent.
    coview_mdm_training_sage_128:
      name: coview-mdm-training-sage-128
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_sage_coview_mdm_128.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_sage_128: seul le bloc optimizer differe
    # (muon au lieu d'adamw) et le dirpath des checkpoints (coview-mdm-128-sage-muon).
    coview_mdm_training_sage_128_muon:
      name: coview-mdm-training-sage-128-muon
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_sage_coview_mdm_128_muon.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_sage_128_muon: seules la tete
    # (tour MLP partagee puis cosine au lieu de hadamard_mlp), le lr (0.0005, aligne sur les
    # variantes cosine) et le dirpath des checkpoints changent.
    coview_mdm_training_sage_128_muon_mlp_cosine:
      name: coview-mdm-training-sage-128-muon-mlp-cosine
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_sage_coview_mdm_128_muon_mlp_cosine.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_sage_128_muon: la tete cosine nue est
    # sans parametres, tout l'apprentissage passe par le GNN (6 tenseurs Muon / 3 AdamW).
    coview_mdm_training_sage_128_muon_cosine:
      name: coview-mdm-training-sage-128-muon-cosine
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_sage_coview_mdm_128_muon_cosine.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme cluster et memes libs que coview_mdm_training_128: le backbone ajoute un canal
    # d'attention globale par-dessus la meme branche GCN (graph_weight: 0.8).
    coview_mdm_training_sgformer_128:
      name: coview-mdm-training-sgformer-128
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/gae_sgformer_coview_mdm_128.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    coview_mdm_training_logreg_baseline:
      name: coview-mdm-training-logreg-baseline
      tasks:
        - task_key: train
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/logreg_baseline_coview_mdm.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    coview_mdm_training_mlp_baseline_128:
      name: coview-mdm-training-mlp-baseline-128
      tasks:
        - task_key: train
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/main.py
            parameters:
              - "--config_file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/mlp_baseline_coview_mdm_128.yml"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    sweep_coview_mdm:
      name: sweep-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_gcn_coview_mdm_128_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    sweep_archi_coview_mdm:
      name: sweep-archi-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_gcn_coview_mdm_128_archi_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Sweep 8 dimensions sur SAGE + hadamard_mlp + Muon (base: gae_sage_coview_mdm_128_muon.yml).
    # wandb_sweep_launch.py cree le sweep puis lance UN agent sequentiel: relancer ce meme job
    # plusieurs fois n'ajoute pas d'agent au sweep existant, ca cree un nouveau sweep_id.
    # Pour paralleliser, recuperer le sweep_id dans les logs et lancer `wandb agent` a la main.
    sweep_sage_128_muon_coview_mdm:
      name: sweep-sage-128-muon-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0703-144521-5dhs4etp
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_sage_coview_mdm_128_muon_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Sweep 7 dimensions sur SAGE + cosine nu + Muon (base: gae_sage_coview_mdm_128_muon_cosine.yml):
    # une dimension de moins que le sweep hadamard_mlp, la tete cosine_similarity etant sans
    # parametres. Cluster dedie (0611-075408-z0otz8r1) pour tourner en parallele du sweep
    # hadamard_mlp, qui occupe 0703-144521-5dhs4etp pendant ~20h.
    sweep_sage_128_muon_cosine_coview_mdm:
      name: sweep-sage-128-muon-cosine-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_sage_coview_mdm_128_muon_cosine_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Sweep optimizer-only (sans archi) sur GCN + cosine nu + Muon
    # (base: gae_gcn_coview_mdm_128_muon_cosine.yml). Cluster dedie pour tourner en parallele
    # du sweep muon_mlp_cosine, qui occupe 0703-144521-5dhs4etp.
    sweep_gcn_128_muon_cosine_coview_mdm:
      name: sweep-gcn-128-muon-cosine-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_gcn_coview_mdm_128_muon_cosine_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Sweep optimizer + tete (num_layers) sans archi backbone sur GCN + mlp_cosine + Muon
    # (base: gae_gcn_coview_mdm_128_muon_mlp_cosine.yml).
    sweep_gcn_128_muon_mlp_cosine_coview_mdm:
      name: sweep-gcn-128-muon-mlp-cosine-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0703-144521-5dhs4etp
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_gcn_coview_mdm_128_muon_mlp_cosine_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme sweep que sweep_sage_128_muon_coview_mdm mais sans les dimensions d'archi
    # (base: gae_sage_coview_mdm_128_muon_no_archi_sweep.yml). Cluster 0608-153856-5bzteuq5:
    # les deux autres clusters sont deja occupes par les sweeps existants (muon et muon-cosine).
    sweep_sage_128_muon_no_archi_coview_mdm:
      name: sweep-sage-128-muon-no-archi-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0608-153856-5bzteuq5
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_sage_coview_mdm_128_muon_no_archi_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

    # Meme sweep que sweep_sage_128_muon_cosine_coview_mdm mais sans les dimensions d'archi
    # (base: gae_sage_coview_mdm_128_muon_cosine_no_archi_sweep.yml). Meme cluster que le job
    # ci-dessus: pas concu pour tourner en parallele l'un de l'autre.
    sweep_sage_128_muon_cosine_no_archi_coview_mdm:
      name: sweep-sage-128-muon-cosine-no-archi-coview-mdm
      tasks:
        - task_key: sweep
          existing_cluster_id: 0611-075408-z0otz8r1
          spark_python_task:
            python_file: scripts/wandb_sweep_launch.py
            parameters:
              - "--config-file"
              - "/Workspace/Users/neil.braun@mirakl.com/.bundle/fast-gnn-benchmark/dev/files/configs/link_prediction/sweep/gae_sage_coview_mdm_128_muon_cosine_no_archi_sweep.yml"
              - "--project"
              - "fast_gnn_benchmark"
              - "--entity"
              - "neilbraunheinrich-national-university-of-singapore"
          libraries:
            - pypi:
                package: torch
            - pypi:
                package: torch_geometric
            - pypi:
                package: boto3

targets:
  dev:
    default: true
    mode: development
